name: Run tests

on:
  push:
    branches: ["main"]
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race ./...

  generated-package-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install UDS CLI
        uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          version: v0.36.0

      - name: Generate full example package
        run: go run . -in examples/full/compose.yaml -out "${RUNNER_TEMP}/generated-package"

      - name: Lint generated package
        run: uds zarf dev lint "${RUNNER_TEMP}/generated-package" --flavor upstream

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2.3.0
        with:
          version: v5.5.0

      - name: Clean runner
        run: uds run --no-progress actions:clean-gh-runner

      - name: Install UDS package test dependencies
        run: uds run --no-progress actions:install-deps

      - name: Run simple example smoke test
        run: uds run --no-progress test-install

      - name: Print cluster diagnostics
        if: failure()
        run: uds run --no-progress actions:debug-output

      - name: Upload smoke-test artifacts
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simple-example-smoke-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/.playwright
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
