name: push-images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_call:
    inputs:
      checkout_ref:
        description: Commit to build for a Release Please release
        required: false
        type: string
      release_tag:
        description: SemVer tag created by Release Please
        required: false
        type: string

jobs:
  image-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Resolve image version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
        run: |
          revision=$(git rev-parse HEAD)
          tag="${RELEASE_TAG#v}"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag:-edge}" >> "${GITHUB_OUTPUT}"

  push-helper-images:
    needs: image-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: wait
            context: internal/images/wait
            repository: ghcr.io/defenseunicorns/compose-bridge-uds/wait
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.image-version.outputs.revision }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }} image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ matrix.repository }}:${{ needs.image-version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/defenseunicorns/compose-bridge-uds
            org.opencontainers.image.revision=${{ needs.image-version.outputs.revision }}

      - name: Save ${{ matrix.image }} image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s\n' "${DIGEST}" > "${RUNNER_TEMP}/digest"

      - name: Upload ${{ matrix.image }} image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.image }}-digest
          path: ${{ runner.temp }}/digest
          if-no-files-found: error

  push-transformer-image:
    needs: [image-version, push-helper-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.image-version.outputs.revision }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download wait image digest
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wait-digest
          path: ${{ runner.temp }}/wait-digest

      - name: Resolve immutable wait image reference
        id: wait-image
        env:
          DIGEST_FILE: ${{ runner.temp }}/wait-digest/digest
        run: |
          digest=$(cat "${DIGEST_FILE}")
          if [[ ! "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid wait image digest: ${digest}" >&2
            exit 1
          fi
          echo "reference=ghcr.io/defenseunicorns/compose-bridge-uds/wait@${digest}" >> "${GITHUB_OUTPUT}"

      - name: Build and push transformer image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          build-args: WAIT_IMAGE=${{ steps.wait-image.outputs.reference }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/defenseunicorns/compose-bridge-uds:${{ needs.image-version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/defenseunicorns/compose-bridge-uds
            org.opencontainers.image.revision=${{ needs.image-version.outputs.revision }}
